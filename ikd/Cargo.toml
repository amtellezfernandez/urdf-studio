[package]
name = "worldd"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "Deterministic world daemon for URDF Studio"

[lib]
name = "ikd"

[dependencies]
axum = { version = "0.8", features = ["json", "macros", "ws"] }
bytes = "1.10"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
nalgebra = "0.33"
roxmltree = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2.1"
quinn = "0.11.9"
rustls = "0.23.36"
rustls-pemfile = "2.2.0"
uuid = { version = "1.18", features = ["serde", "v4"] }
wtransport = "0.7.0"

[dev-dependencies]
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
wtransport = { version = "0.7.0", features = ["dangerous-configuration"] }
