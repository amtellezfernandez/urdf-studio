# Scenario format: docs/specs/SCENARIO_FORMAT.md (scenario-v1)
schema_version: scenario-v1
scenario_id: carton_sorting_0001
title: Sort the red carton into bin A

world:
  package: ./carton-sorting.world-package.json
  frame_map: identity
  include_hidden: false

robot:
  # world.urdf_xml snapshot is used when urdf is omitted
  base_pose: {xyz: [0.0, 0.0, 0.0], rpy: [0.0, 0.0, 0.0]}
  init_joint_positions: {}
  init_noise_joint_regex: {}

task:
  family: pick_place
  instruction: "Pick up the {object:carton} and place it into {object:bin}"
  objects:
    carton: {role: target, world_object_id: carton_1}
    bin: {role: container, world_object_id: bin_a}
  randomization:
    seed: 0
    object_pose:
      carton_1:
        position_jitter_m: [0.05, 0.05, 0.0]
        yaw_jitter_rad: 0.4
        region: table_top
    regions:
      # Table top surface: carton center sits at table_z + half carton height.
      table_top:
        aabb_min: [0.25, -0.3, 0.755]
        aabb_max: [0.6, 0.1, 0.755]

success:
  all_of:
    # bin_a is a non-colliding drop-zone volume on the table; Inside checks the
    # carton's center against the zone AABB (scaled by ratio).
    # NOTE: the vendored `upright` checker follows Genie Sim's local-Y-up mesh
    # convention; it is unsuitable for Z-up primitive objects like this carton.
    - inside: {object: carton_1, container: bin_a, ratio: 1.2}
  guards:
    - no_collision: {pairs: [[robot, bin_b]]}
    - above_plane: {object: carton_1, z_min: 0.0}
  timeout_sim_seconds: 30

runtime:
  physics_timestep_s: 0.002
  control_hz: 50
  checker_interval_steps: 5
  max_episode_steps: 1500
  observation:
    modalities: [joint_positions, object_poses]

policy:
  kind: none
  params: {}

metrics:
  - success_rate
  - time_to_success_s
  - final_object_pose_error_m

evaluation:
  episodes: 1
  seeds: [0]
  record_trace: true
  record_decisions: true
  record_video: false
