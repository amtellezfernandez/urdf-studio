name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Clean release checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.6
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Node deps
        run: npm ci
      - name: Install backend deps
        run: python -m pip install fastapi python-multipart uvicorn pydantic httpx pytest numpy==2.2.6 yourdfpy
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Backend tests
        run: URDF_STUDIO_PYTHON=python npm run test:backend
