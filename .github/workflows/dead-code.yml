name: Dead Code Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  dead-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Run dead-code scan
        run: node tools/scripts/dead-code-check.js
