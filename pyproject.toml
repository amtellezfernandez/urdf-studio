[project]
name = "urdf-studio"
version = "0.1.0"
description = "URDF Studio - Robot visualization and training platform"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "aiosqlite>=0.19.0",
    "httpx>=0.25.0",

    # URDF parsing
    "yourdfpy>=0.0.56",
    "numpy>=1.24.0",

    # JAX for optimization
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "jax_dataclasses>=1.6.0",
    "jaxlie>=1.3.0",
    "jaxls",

    # LeRobot and ML dependencies
    "lerobot>=0.1.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "huggingface_hub>=0.20.0",
    "safetensors>=0.4.0",

    # Experiment tracking
    "wandb>=0.16.0",
    "mlflow>=2.9.0",

    # Visualization
    "rerun-sdk>=0.18.0",

    # IK solver
    "placo>=0.8.0",

    # Database migrations
    "alembic>=1.13.0",

    # Vendored dependencies
    "pyroki",
]

[tool.uv.sources]
pyroki = { path = "vendor/pyroki", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

cpu = [
    # CPU-only torch (use with --extra-index-url https://download.pytorch.org/whl/cpu)
    "torch>=2.1.0",
    "torchvision>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
